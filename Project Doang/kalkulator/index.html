<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <span class="header"><h1>Kalkulator Gue</h1></span>
        <form id="kalkulator">
            <div class="input-group">
                <input type="text" id="angka_1" placeholder="angka pertama">
                <input type="text" id="angka_2" placeholder="angka kedua">
                <input type="text" id="operasi" placeholder="operasi">
                <button type="submit" class="btn" id="button_hasil">Hasil</button>
            </div>
        </form>
        <div class="hasil">
            <span id="hasil"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
